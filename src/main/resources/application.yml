server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: bench
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

bench:
  data-file: ${BENCH_DATA_FILE:/app/data/site.json}
  admin-token: ${ADMIN_TOKEN:}
  site-url: ${SITE_URL:https://maxmya.com}

logging:
  level:
    io.maxmya.bench: INFO
